<!DOCTYPE html>
<html>

<head>

    <title>LogSentinel Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            font-family: Arial, sans-serif;
            margin:40px;
            background:#f5f5f5;
        }

        .stats{
            display:flex;
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            border:1px solid #ccc;
            padding:20px;
            background:white;
            border-radius:8px;
            box-shadow:0 2px 5px rgba(0,0,0,0.1);
        }

        .attack-card{
            border:1px solid #ddd;
            padding:15px;
            margin-bottom:15px;
            background:white;
            border-radius:8px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
            background:white;
        }

        table, th, td{
            border:1px solid #ccc;
        }

        th, td{
            padding:10px;
            text-align:left;
        }

        th{
            background:#eaeaea;
        }

        canvas{
            margin-top:30px;
            background:white;
            padding:20px;
            border-radius:8px;
        }

    </style>

</head>

<body>

    <h1>🛡️ LogSentinel Dashboard</h1>

    <div class="stats">

        <div class="card">
            <h2>Total Attackers</h2>
            <h1>{{ total_attacks }}</h1>
        </div>

        <div class="card">
            <h2>Critical Threats</h2>
            <h1>{{ critical }}</h1>
        </div>

    </div>

    <h2>Threat Summary</h2>

    <table>

        <tr>
            <th>IP Address</th>
            <th>Threat Score</th>
            <th>Country</th>
        </tr>

        {% for attack in attacks %}
        <tr>
            <td>{{ attack.ip }}</td>
            <td>{{ attack.score }}</td>
            <td>{{ attack.country }}</td>
        </tr>
        {% endfor %}

    </table>

    <h2>Threat Score by IP</h2>

    <canvas id="attackChart"></canvas>

    <script>

        const labels = [
        {% for attack in attacks %}
            "{{ attack.ip }}",
        {% endfor %}
        ];

        const scores = [
        {% for attack in attacks %}
            {{ attack.score }},
        {% endfor %}
        ];

        new Chart(
            document.getElementById('attackChart'),
            {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Threat Score',
                        data: scores
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    }
                }
            }
        );

    </script>

</body>

</html>
